<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Live Monitoring</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/styles.css">

  <style>
      body {
          background: #f4f7fb;
          margin: 0;
          padding: 0;
          font-family: Arial, sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
      }

      nav {
          width: 100%;
          background: #1b4de4;
          padding: 15px 25px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          color: #fff;
          box-sizing: border-box;
      }

      nav h1 { margin: 0; font-size: 22px; }
      nav ul {
          list-style: none;
          display: flex;
          gap: 20px;
          margin: 0;
          padding: 0;
      }
      nav ul li a { color: white; text-decoration: none; font-size: 16px; }

      .page-container {
          width: 100%;
          max-width: 750px;
          margin-top: 40px;
          display: flex;
          justify-content: center;
      }

      .content {
          width: 100%;
          background: white;
          padding: 35px;
          border-radius: 12px;
          box-shadow: 0 4px 18px rgba(0,0,0,0.15);
          text-align: center;
      }

      h2 { margin-top: 0; color: #1b4de4; }
      .hint { color: #666; margin-bottom: 25px; }

      .form-label { display: block; text-align: left; margin: 12px 0 6px; font-weight: bold; }

      .form-select, input[type="file"] {
          width: 100%;
          padding: 10px;
          border-radius: 6px;
          border: 1px solid #ccc;
          margin-bottom: 15px;
      }

      button.submit {
          background: #1b4de4;
          color: white;
          border: none;
          padding: 12px 20px;
          border-radius: 6px;
          font-size: 16px;
          cursor: pointer;
          width: 100%;
          margin-top: 15px;
      }
      button.submit:hover { background: #163ec4; }

  </style>
</head>

<body>

<nav>
  <h1>Live Monitoring</h1>
  <ul>
    <li><a href="/home">Home</a></li>
    <li><a href="/results">Results</a></li>
    <li><a href="/logout">Logout</a></li>
  </ul>
</nav>

<div class="page-container">
  <div class="content">

    <h2>Configure Live Monitoring</h2>
    <p class="hint">Upload videos and select the detection type.</p>

    <form method="POST" action="/live_monitoring" enctype="multipart/form-data">

      <!-- Cameras -->
      <label class="form-label">Number of Cameras</label>
      <select id="numCameras" name="numCameras" class="form-select" onchange="updateVisibility()">
        <option value="1" {% if numCameras==1 %}selected{% endif %}>1</option>
        <option value="2" {% if numCameras==2 %}selected{% endif %}>2</option>
        <option value="3" {% if numCameras==3 %}selected{% endif %}>3</option>
        <option value="4" {% if numCameras==4 %}selected{% endif %}>4</option>
      </select>

      <!-- Process Type -->
      <label class="form-label">Select Detection Type</label>
      <select id="processType" name="processType" class="form-select">

        <option value="anpr">Number Plate (ANPR)</option>
        <option value="atcc">ATCC (Vehicle Count + Lane)</option>
        <option value="helmet">Helmet Detection</option>
        <option value="triple">Triple Riding</option>
        <option value="phone">Phone Usage</option>
        <option value="seatbelt">Seatbelt Detection</option>
        <option value="wronglane">Wrong Lane Detection</option>
        <option value="accident">Accident Detection</option>

      </select>

      <!-- Camera Inputs -->
      <div id="fileInputs">
        <div><label>Camera 1 File</label><input type="file" name="cameraFile1"></div>
        <div><label>Camera 2 File</label><input type="file" name="cameraFile2"></div>
        <div><label>Camera 3 File</label><input type="file" name="cameraFile3"></div>
        <div><label>Camera 4 File</label><input type="file" name="cameraFile4"></div>
      </div>

      <button type="submit" class="submit">Start Processing</button>

    </form>

  </div>
</div>


<script>
function updateVisibility() {
  const n = Number(document.getElementById('numCameras').value);
  const inputs = document.querySelectorAll('#fileInputs > div');
  inputs.forEach((box, idx) => {
      box.style.display = idx < n ? "block" : "none";
  });
}

window.onload = function() { updateVisibility(); };
</script>

</body>
</html>
